<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belge önizleme</title>
  <style>html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; display: block; }</style>
</head>
<body>
  <iframe sandbox="" title="Belge önizleme"></iframe>
<script>
'use strict';

const content = document.querySelector('iframe');
window.addEventListener('message', (event) => {
  if (event.source !== window.parent || event.origin !== window.location.origin
      || typeof event.data?.html !== 'string') return;

  content.title = event.data.title || 'Belge önizleme';
  content.srcdoc = event.data.html;
});
</script>
</body>
</html>
